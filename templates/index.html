<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OLT Monitoring Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .sidebar { background-color: #212529; min-height: 100vh; color: #fff; padding-top: 20px; }
        .sidebar h4 { color: #0d6efd; font-weight: bold; }
        .list-group-item-action { cursor: pointer; }
        .card-summary { border-left: 4px solid #0d6efd; }
    </style>
</head>
<body>
    <div class="container-fluid">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-md-3 col-lg-2 sidebar">
                <h4 class="text-center mb-4">🌐 OLT Dashboard</h4>
                <div class="list-group list-group-flush">
                    {% for olt in olts %}
                    <button class="list-group-item list-group-item-action list-group-item-dark text-white bg-dark mb-1 rounded" onclick="loadOnuData('{{ olt.id }}', '{{ olt.name }}')">
                        ⚡ {{ olt.name }}
                        <br><small class="text-muted">{{ olt.ip }}:{{ olt.port }}</small>
                    </button>
                    {% endfor %}
                </div>
            </div>

            <!-- Main Content -->
            <div class="col-md-9 col-lg-10 p-4">
                <div class="d-flex justify-content-between align-items-center mb-4">
                    <h2 id="olt-title" class="fw-bold">Select an OLT to View Status</h2>
                    <span class="badge bg-success fs-6">System Status: Active</span>
                </div>

                <!-- Stats Cards -->
                <div class="row mb-4">
                    <div class="col-md-4">
                        <div class="card card-summary shadow-sm p-3">
                            <h6 class="text-muted">Total Active ONUs</h6>
                            <h3 id="total-onu" class="fw-bold text-primary">0</h3>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card card-summary shadow-sm p-3" style="border-left-color: #198754;">
                            <h6 class="text-muted">Online ONUs</h6>
                            <h3 id="online-onu" class="fw-bold text-success">0</h3>
                        </div>
                    </div>
                    <div class="col-md-4">
                        <div class="card card-summary shadow-sm p-3" style="border-left-color: #dc3545;">
                            <h6 class="text-muted">Offline ONUs</h6>
                            <h3 id="offline-onu" class="fw-bold text-danger">0</h3>
                        </div>
                    </div>
                </div>

                <!-- ONU Table -->
                <div class="card shadow-sm">
                    <div class="card-header bg-white font-weight-bold">
                        <h5 class="m-0">Connected ONUs List</h5>
                    </div>
                    <div class="card-body">
                        <div class="table-responsive">
                            <table class="table table-hover align-middle">
                                <thead class="table-light">
                                    <tr>
                                        <th>PON Port</th>
                                        <th>Username</th>
                                        <th>MAC Address</th>
                                        <th>Rx Power (dBm)</th>
                                        <th>Temp</th>
                                        <th>Status</th>
                                        <th>VLAN</th>
                                    </tr>
                                </thead>
                                <tbody id="onu-table-body">
                                    <tr>
                                        <td colspan="7" class="text-center text-muted">Please select an OLT from the left menu.</td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        function loadOnuData(oltId, oltName) {
            document.getElementById('olt-title').innerText = oltName + " - Live Status";
            fetch('/api/get-onu-data/' + oltId)
                .then(response => response.json())
                .then(res => {
                    let rows = '';
                    let online = 0, offline = 0;
                    res.data.forEach(item => {
                        if (item.status === 'Online') online++;
                        else offline++;

                        let statusBadge = item.status === 'Online' 
                            ? '<span class="badge bg-success">Online</span>' 
                            : '<span class="badge bg-danger">Offline</span>';

                        rows += `<tr>
                            <td><b>${item.pon}</b></td>
                            <td>${item.username}</td>
                            <td><code>${item.mac}</code></td>
                            <td>${item.dbm} dBm</td>
                            <td>${item.temp}</td>
                            <td>${statusBadge}</td>
                            <td><span class="badge bg-secondary">${item.vlan}</span></td>
                        </tr>`;
                    });

                    document.getElementById('onu-table-body').innerHTML = rows;
                    document.getElementById('total-onu').innerText = res.data.length;
                    document.getElementById('online-onu').innerText = online;
                    document.getElementById('offline-onu').innerText = offline;
                });
        }
    </script>
</body>
</html>
